      name: build reactor-core jar
      with:
        arguments: :reactor-core:jar --no-daemon
    - uses: actions/upload-artifact@v4
      with:
        name: reactor-core-jar
        path: reactor-core/build/libs/reactor-core-3.5.9.jar
