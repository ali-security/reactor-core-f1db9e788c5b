      name: other tests
      with:
        arguments: --init-script ${{ runner.temp }}/seal-skip/skip.gradle ${{ inputs.test-filter == '' && 'check -x :reactor-core:test -x spotlessCheck -x jcstress --no-daemon' || 'assemble --no-daemon' }}
