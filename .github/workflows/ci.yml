  other:
    name: other tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: preliminary
    services:
      zipkin:
        image: openzipkin/zipkin:2
        ports:
          - 9411:9411
    steps:
    - uses: actions/checkout@93ea575cb5d8a053eaa0ac8fa3b40d7e05a33cc8 # tag=v3
